<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#111111"/>
  <!-- Left lens -->
  <rect x="2" y="11" width="12" height="10" rx="5" fill="none" stroke="#f0ede8" stroke-width="2.5"/>
  <!-- Right lens -->
  <rect x="18" y="11" width="12" height="10" rx="5" fill="none" stroke="#f0ede8" stroke-width="2.5"/>
  <!-- Bridge -->
  <line x1="14" y1="16" x2="18" y2="16" stroke="#f0ede8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left arm -->
  <line x1="2" y1="13.5" x2="0" y2="11" stroke="#f0ede8" stroke-width="2" stroke-linecap="round"/>
  <!-- Right arm -->
  <line x1="30" y1="13.5" x2="32" y2="11" stroke="#f0ede8" stroke-width="2" stroke-linecap="round"/>
</svg>
