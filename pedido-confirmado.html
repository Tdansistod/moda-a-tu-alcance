<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>¡Pedido recibido! — Emma Moda a tu Alcance</title>
  <script>(function(){var t=localStorage.getItem('emma_theme')||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);})();</script>
  <link rel="stylesheet" href="css/styles.css"/>
  <style>
    .confirm-page { padding: 64px 0 100px; }
    .confirm-card {
      max-width: 640px;
      margin: 0 auto;
      text-align: center;
    }
    .confirm-icon {
      width: 80px; height: 80px;
      background: #e8f5e2;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin: 0 auto 24px;
    }
    .confirm-title {
      font-family: var(--font-serif);
      font-size: clamp(26px, 4vw, 40px);
      font-weight: 700;
      margin-bottom: 12px;
    }
    .confirm-sub {
      font-size: 15px;
      color: var(--gray-700);
      line-height: 1.7;
      margin-bottom: 32px;
    }

    /* Order number */
    .order-number {
      background: var(--gray-50);
      border: 1px dashed var(--gray-300);
      padding: 16px 24px;
      margin-bottom: 32px;
      display: inline-block;
    }
    .order-number small {
      display: block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gray-500);
      margin-bottom: 4px;
    }
    .order-number strong {
      font-size: 18px;
      font-weight: 700;
      font-family: monospace;
    }

    /* Details */
    .confirm-details {
      background: var(--gray-50);
      padding: 28px;
      margin-bottom: 28px;
      text-align: left;
    }
    .confirm-details h3 {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gray-500);
      margin-bottom: 16px;
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      padding: 8px 0;
      border-bottom: 1px solid var(--gray-100);
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-row span:first-child { color: var(--gray-500); }
    .detail-row span:last-child  { font-weight: 600; text-align: right; }

    /* Items */
    .confirm-items {
      text-align: left;
      margin-bottom: 28px;
    }
    .confirm-items h3 {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gray-500);
      margin-bottom: 12px;
    }
    .confirm-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 0;
      border-bottom: 1px solid var(--gray-100);
      font-size: 13px;
    }
    .confirm-item-img {
      width: 52px;
      aspect-ratio: 3/4;
      overflow: hidden;
      background: var(--gray-100);
      flex-shrink: 0;
    }
    .confirm-item-img img { width:100%; height:100%; object-fit:cover; }
    .confirm-item-name { font-weight: 600; }
    .confirm-item-meta { color: var(--gray-500); font-size: 11px; margin-top: 2px; }
    .confirm-item-price { margin-left: auto; font-weight: 700; }

    .confirm-total {
      display: flex;
      justify-content: space-between;
      font-size: 17px;
      font-weight: 700;
      padding-top: 16px;
      margin-top: 4px;
      border-top: 2px solid var(--black);
      text-align: left;
      margin-bottom: 32px;
    }

    /* WhatsApp CTA */
    .wa-cta {
      background: #25d366;
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 18px 32px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
      transition: background 0.2s, transform 0.15s;
    }
    .wa-cta:hover { background: #1eb854; transform: scale(1.01); color: var(--white); }
    .wa-cta svg { flex-shrink: 0; }

    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>

  <!-- Header minimal -->
  <header class="header">
    <div class="container">
      <div class="header-inner">
        <a href="index.html" class="logo">
          <img class="logo-img-dark"  src="https://pztftznwvrsoipiuhwof.supabase.co/storage/v1/object/public/assets/logo/logo-dark.jpg"  alt="Emma"/>
          <img class="logo-img-light" src="https://pztftznwvrsoipiuhwof.supabase.co/storage/v1/object/public/assets/logo/logo-light.jpg" alt="Emma"/>
        </a>
        <div class="header-actions">
          <button class="theme-toggle" onclick="toggleTheme()" aria-label="Cambiar tema">
            <svg class="theme-icon-light" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg class="theme-icon-dark" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          </button>
          <a href="catalogo.html" class="btn btn-outline" style="padding:8px 16px;">Seguir comprando</a>
        </div>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="confirm-page">
      <div class="confirm-card" id="confirm-card">
        <!-- Cargado por JS -->
      </div>
    </div>
  </div>

  <!-- WhatsApp float oculto en esta página (el CTA principal es el botón) -->

  <script src="js/data.js"></script>
  <script src="js/theme.js"></script>
  <script>
    const data = JSON.parse(sessionStorage.getItem('emma_pedido_confirmado') || 'null');

    const card = document.getElementById('confirm-card');

    if (!data) {
      card.innerHTML = `
        <div class="confirm-icon">🛍️</div>
        <h1 class="confirm-title">No hay pedido</h1>
        <p class="confirm-sub">No encontramos un pedido reciente.</p>
        <a href="index.html" class="btn btn-dark">Volver al inicio</a>`;
    } else {
      // Build WhatsApp message
      const items = data.items.map(i =>
        `• ${i.nombre} (${i.talle} / ${i.color}) ×${i.qty} — ${formatPrecio(i.precio * i.qty)}`
      ).join('\n');

      const msg = `Hola Emma! 👋 Acabo de hacer un pedido en la tienda.\n\n` +
        `*Pedido #${String(data.id).padStart(6, '0')}*\n\n` +
        `${items}\n\n` +
        `*Total:* ${formatPrecio(data.total)}\n\n` +
        `*Datos de entrega:*\n` +
        `${data.nombre}\n` +
        `${data.direccion}, ${data.localidad}${data.provincia ? ', ' + data.provincia : ''}\n` +
        `WhatsApp: ${data.whatsapp}\n\n` +
        `${data.nota ? '📝 Nota: ' + data.nota + '\n\n' : ''}` +
        `¡Quedo esperando confirmación! 🙏`;

      const waUrl = `https://wa.me/5492944486963?text=${encodeURIComponent(msg)}`;
      const orderId = String(data.id).padStart(6, '0').toUpperCase();

      card.innerHTML = `
        <div class="confirm-icon">✅</div>
        <h1 class="confirm-title">¡Pedido recibido!</h1>
        <p class="confirm-sub">
          Gracias <strong>${data.nombre.split(' ')[0]}</strong> por tu compra.
          Ahora necesitamos que nos contactes por WhatsApp para confirmar el stock y coordinar el pago y el envío.
        </p>

        <div class="order-number">
          <small>Número de pedido</small>
          <strong>#${orderId}</strong>
        </div>

        <!-- WhatsApp CTA -->
        <a href="${waUrl}" target="_blank" rel="noopener" class="wa-cta">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="white">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
          </svg>
          Coordinar por WhatsApp
        </a>

        <p style="font-size:11px;color:var(--gray-500);margin-bottom:24px;">
          Al hacer clic se abre WhatsApp con tu pedido completo ya cargado 👆
        </p>

        <!-- Datos del pedido -->
        <div class="confirm-details">
          <h3>Datos de entrega</h3>
          <div class="detail-row"><span>Nombre</span><span>${data.nombre}</span></div>
          <div class="detail-row"><span>WhatsApp</span><span>${data.whatsapp}</span></div>
          <div class="detail-row"><span>Dirección</span><span>${data.direccion}</span></div>
          <div class="detail-row"><span>Localidad</span><span>${data.localidad}${data.provincia ? ', ' + data.provincia : ''}</span></div>
          ${data.nota ? `<div class="detail-row"><span>Nota</span><span>${data.nota}</span></div>` : ''}
        </div>

        <!-- Items -->
        <div class="confirm-items">
          <h3>Productos</h3>
          ${data.items.map(item => `
            <div class="confirm-item">
              <div class="confirm-item-img">
                <img src="${item.imagen}" alt="${item.nombre}" loading="lazy"/>
              </div>
              <div>
                <p class="confirm-item-name">${item.nombre}</p>
                <p class="confirm-item-meta">${item.talle} / ${item.color} ×${item.qty}</p>
              </div>
              <span class="confirm-item-price">${formatPrecio(item.precio * item.qty)}</span>
            </div>
          `).join('')}
        </div>

        <div class="confirm-total">
          <span>Total del pedido</span>
          <span>${formatPrecio(data.total)}</span>
        </div>

        <div class="actions">
          <a href="catalogo.html" class="btn btn-outline">Seguir comprando</a>
          <a href="index.html"    class="btn btn-dark">Volver al inicio</a>
        </div>
      `;
    }
  </script>
</body>
</html>
