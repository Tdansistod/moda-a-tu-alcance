  <style>
    /* ── Page header ── */
    .page-hero {
      background: var(--gray-50);
      padding: 48px 0 36px;
      border-bottom: 1px solid var(--gray-100);
      text-align: center;
    }
    .page-hero h1 {
      font-family: var(--font-serif);
      font-size: clamp(28px, 4vw, 44px);
      font-weight: 700;
      margin-bottom: 8px;
    }
    .page-hero p { font-size: 13px; color: var(--gray-500); }
    .breadcrumb {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--gray-500);
      margin-bottom: 16px;
    }
    .breadcrumb a { color: var(--gray-500); }
    .breadcrumb a:hover { color: var(--black); }
    .breadcrumb span { color: var(--black); }

    /* ── Layout ── */
    .catalog-layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 40px;
      padding: 48px 0 80px;
      align-items: start;
    }

    /* ── Sidebar ── */
    .sidebar { position: sticky; top: 86px; }
    .sidebar-section { border-bottom: 1px solid var(--gray-100); padding-bottom: 24px; margin-bottom: 24px; }
    .sidebar-section:last-child { border-bottom: none; }
    .sidebar-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gray-500);
      margin-bottom: 14px;
    }
    .filter-list { display: flex; flex-direction: column; gap: 6px; }
    .filter-btn {
      text-align: left;
      font-size: 13px;
      font-weight: 500;
      color: var(--gray-700);
      padding: 6px 10px;
      border-radius: 2px;
      transition: all 0.15s;
      border: 1px solid transparent;
    }
    .filter-btn:hover { color: var(--black); background: var(--gray-50); }
    .filter-btn.active { color: var(--black); font-weight: 700; border-color: var(--black); }

    .size-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .size-btn {
      padding: 8px 4px;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      border: 1.5px solid var(--gray-300);
      color: var(--gray-700);
      transition: all 0.15s;
    }
    .size-btn:hover { border-color: var(--black); color: var(--black); }
    .size-btn.active { background: var(--black); color: var(--white); border-color: var(--black); }

    /* ── Catalog main ── */
    .catalog-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--gray-100);
    }
    .catalog-count { font-size: 13px; color: var(--gray-500); }
    .catalog-count strong { color: var(--black); font-weight: 700; }
    .sort-select {
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 600;
      color: var(--black);
      border: 1.5px solid var(--gray-300);
      padding: 8px 12px;
      background: var(--white);
      cursor: pointer;
    }

    /* ── Product grid ── */
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    /* ── Active filters ── */
    .active-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }
    .filter-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--black);
      color: var(--white);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      padding: 5px 10px;
    }
    .filter-tag button {
      color: rgba(255,255,255,0.7);
      font-size: 13px;
      line-height: 1;
      padding: 0;
    }
    .filter-tag button:hover { color: var(--white); }

    /* ── Empty state ── */
    .empty-state {
      grid-column: 1/-1;
      text-align: center;
      padding: 80px 0;
      color: var(--gray-500);
    }
    .empty-state .empty-icon { font-size: 48px; margin-bottom: 16px; }
    .empty-state h3 { font-size: 18px; color: var(--black); margin-bottom: 8px; }

    /* ── Mobile filter toggle ── */
    .mobile-filter-btn {
      display: none;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 10px 16px;
      border: 1.5px solid var(--black);
      color: var(--black);
    }
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 200;
    }
    .sidebar-overlay.open { display: block; }

    @media (max-width: 900px) {
      .catalog-layout { grid-template-columns: 1fr; }
      .sidebar {
        position: fixed;
        top: 0; left: -280px;
        width: 280px;
        height: 100vh;
        background: var(--white);
        z-index: 210;
        overflow-y: auto;
        padding: 24px;
        transition: left 0.3s ease;
        box-shadow: 4px 0 20px rgba(0,0,0,0.15);
      }
      .sidebar.open { left: 0; }
      .mobile-filter-btn { display: flex; }
      .catalog-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 480px) {
      .catalog-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    }
  </style>

  <script>
    // ── State ──────────────────────────────────────────
    const params = new URLSearchParams(location.search);
    let state = {
      cat:    params.get('cat')   || '',
      genero: params.get('genero')|| '',
      talle:  '',
      sale:   params.get('sale')  || '',
      sort:   'default'
    };

    // ── Render ─────────────────────────────────────────
    function renderProducts() {
      let lista = PRODUCTOS.filter(p => {
        if (state.cat    && p.categoria !== state.cat) return false;
        if (state.genero && p.genero    !== state.genero) return false;
        if (state.sale   && !p.sale) return false;
        if (state.talle  && !p.talles.includes(state.talle)) return false;
        return true;
      });

      // Sort
      if (state.sort === 'precio-asc')  lista.sort((a,b) => a.precio - b.precio);
      if (state.sort === 'precio-desc') lista.sort((a,b) => b.precio - a.precio);
      if (state.sort === 'nuevo')       lista.sort((a,b) => (b.nuevo?1:0) - (a.nuevo?1:0));

      const grid = document.getElementById('catalog-grid');
      document.getElementById('results-count').textContent = lista.length;

      if (!lista.length) {
        grid.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🔍</div>
            <h3>No encontramos productos</h3>
            <p>Intentá con otros filtros</p>
          </div>`;
        return;
      }

      grid.innerHTML = lista.map(p => `
        <a href="producto.html?id=${p.id}" class="product-card">
          <div class="product-card-image">
            <img src="${p.imagenes[0]}" alt="${p.nombre}" loading="lazy"/>
            ${p.nuevo ? '<span class="product-card-badge">Nuevo</span>' : ''}
            ${p.sale  ? '<span class="product-card-badge" style="background:#c0392b">Oferta</span>' : ''}
            <span class="product-card-quick">Ver producto</span>
          </div>
          <p class="product-card-name">${p.nombre}</p>
          <p class="product-card-price">
            ${p.precioAntes ? `<span class="old-price">${formatPrecio(p.precioAntes)}</span>` : ''}
            ${formatPrecio(p.precio)}
          </p>
        </a>
      `).join('');
    }

    function renderActiveFilters() {
      const labels = {
        cat:    { buzos:'Buzos y Suéteres', pantalones:'Pantalones y Jeans', camperas:'Camperas y Chalecos', maquillaje:'Maquillaje' },
        genero: { mujer:'Mujer', hombre:'Hombre' },
        sale:   { '1':'Ofertas' },
        talle:  {}
      };
      const container = document.getElementById('active-filters');
      const tags = [];
      if (state.cat)    tags.push({ label: labels.cat[state.cat],    key:'cat' });
      if (state.genero) tags.push({ label: labels.genero[state.genero], key:'genero' });
      if (state.sale)   tags.push({ label: 'Ofertas',                  key:'sale' });
      if (state.talle)  tags.push({ label: `Talle ${state.talle}`,    key:'talle' });

      container.innerHTML = tags.map(t => `
        <span class="filter-tag">${t.label}
          <button onclick="clearFilter('${t.key}')">×</button>
        </span>`).join('');

      document.getElementById('clear-filters').style.display = tags.length ? 'block' : 'none';
    }

    function clearFilter(key) { state[key] = ''; syncUI(); renderAll(); }
    function renderAll() { renderProducts(); renderActiveFilters(); }

    function syncUI() {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        const f = btn.dataset.filter, v = btn.dataset.val;
        btn.classList.toggle('active', state[f] === v);
      });
      document.querySelectorAll('.size-btn').forEach(btn => {
        btn.classList.toggle('active', state.talle === btn.dataset.talle);
      });
      // Page title
      const catNames = { '':'Catálogo', buzos:'Buzos y Suéteres', pantalones:'Pantalones y Jeans', camperas:'Camperas y Chalecos', maquillaje:'Maquillaje y Belleza' };
      const genNames = { '':'', mujer:' — Mujer', hombre:' — Hombre' };
      document.getElementById('page-title').textContent = (catNames[state.cat]||'Catálogo') + (genNames[state.genero]||'');
      document.getElementById('breadcrumb-cat').textContent = catNames[state.cat] || 'Catálogo';
      document.getElementById('page-subtitle').textContent = state.sale ? 'Productos en oferta' : 'Explorá toda nuestra colección';
    }

    // ── Event listeners ────────────────────────────────
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state[btn.dataset.filter] = btn.dataset.val;
        syncUI(); renderAll();
        // Close mobile sidebar
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('sidebar-overlay').classList.remove('open');
      });
    });

    document.querySelectorAll('.size-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.talle = state.talle === btn.dataset.talle ? '' : btn.dataset.talle;
        syncUI(); renderAll();
      });
    });

    document.getElementById('sort-select').addEventListener('change', e => {
      state.sort = e.target.value; renderAll();
    });

    document.getElementById('clear-filters').addEventListener('click', () => {
      state = { cat:'', genero:'', talle:'', sale:'', sort:'default' };
      syncUI(); renderAll();
    });

    // Mobile sidebar
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    document.getElementById('mobile-filter-btn').addEventListener('click', () => {
      sidebar.classList.add('open'); overlay.classList.add('open');
    });
    overlay.addEventListener('click', () => {
      sidebar.classList.remove('open'); overlay.classList.remove('open');
    });

    // Header hamburger
    document.getElementById('hamburger-btn').addEventListener('click', () => {
      document.getElementById('mobile-nav').classList.toggle('open');
    });

    // ── Init ───────────────────────────────────────────
    document.getElementById('catalog-grid').innerHTML =
      '<div style="grid-column:1/-1;text-align:center;padding:60px 0;color:var(--gray-500);">Cargando productos...</div>';

    (async function init() {
      await loadProductos();
      syncUI();
      renderAll();
      actualizarBadge();
    })();
  </script>
