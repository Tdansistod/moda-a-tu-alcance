<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin — Emma</title>
  <link rel="stylesheet" href="../css/styles.css"/>
  <style>
    body { background: var(--gray-50); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card {
      width: 100%;
      max-width: 400px;
      background: var(--white);
      padding: 48px 40px;
      box-shadow: 0 2px 24px rgba(0,0,0,0.08);
    }
    .login-logo { text-align: center; margin-bottom: 8px; }
    .login-logo img { height: 40px; margin: 0 auto; }
    .login-subtitle {
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gray-500);
      margin-bottom: 36px;
    }
    .form-group { margin-bottom: 18px; }
    .form-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--gray-700);
      margin-bottom: 7px;
    }
    .form-input {
      width: 100%;
      padding: 12px 14px;
      font-family: var(--font-sans);
      font-size: 14px;
      border: 1.5px solid var(--gray-300);
      outline: none;
      transition: border-color 0.2s;
    }
    .form-input:focus { border-color: var(--black); }
    .login-btn {
      width: 100%;
      padding: 14px;
      background: var(--black);
      color: var(--white);
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
    .login-btn:hover { background: #333; }
    .login-error {
      display: none;
      margin-top: 14px;
      padding: 12px;
      background: #ffeaea;
      border-left: 3px solid #c0392b;
      font-size: 13px;
      color: #c0392b;
      font-weight: 600;
    }
    .login-error.show { display: block; }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: var(--gray-500);
    }
    .back-link a { color: var(--gray-500); text-decoration: underline; }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-logo">
      <img src="https://pztftznwvrsoipiuhwof.supabase.co/storage/v1/object/public/assets/logo/logo-dark.jpg" alt="Emma"/>
    </div>
    <p class="login-subtitle">Panel de administración</p>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input class="form-input" type="email" id="email" placeholder="admin@emma.com" autocomplete="email"/>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Contraseña</label>
        <input class="form-input" type="password" id="password" placeholder="••••••••" autocomplete="current-password"/>
      </div>
      <button type="submit" class="login-btn" id="login-btn">Ingresar</button>
      <div class="login-error" id="login-error">Email o contraseña incorrectos</div>
    </form>

    <p class="back-link"><a href="../index.html">← Volver a la tienda</a></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../js/supabase.js"></script>
  <script>
    // Redirect if already logged in
    db.auth.getSession().then(({ data: { session } }) => {
      if (session) location.href = 'dashboard.html';
    });

    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn      = document.getElementById('login-btn');
      const errEl    = document.getElementById('login-error');

      btn.disabled    = true;
      btn.textContent = 'Ingresando...';
      errEl.classList.remove('show');

      const { error } = await db.auth.signInWithPassword({ email, password });

      if (error) {
        errEl.classList.add('show');
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
        btn.disabled    = false;
        btn.textContent = 'Ingresar';
      } else {
        location.href = 'dashboard.html';
      }
    });

    document.querySelectorAll('.form-input').forEach(inp => {
      inp.addEventListener('input', () => {
        document.getElementById('login-error').classList.remove('show');
      });
    });
  </script>
</body>
</html>
